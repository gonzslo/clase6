<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Clase 6  </title>
        <style>
            body {
                font-family: Helvetica, Arial, sans-serif;
				color: hotpink
            }
			table {
			    border-collapse: collapse;
				text-align:left;
			}
			
			td {
			    border:1px solid black;
                padding:1rem
            }			
        </style>
    </head>
    <body>
        <h1>Electivos Sofía Romo</h1>
        <table>
		    <thead>
			    <tr>
				    <th>Asignatura</th>
					<th>Grupo</th>
					<th>Enfoque</th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
        <script>
		
		    const t = document.querySelector("tbody");
			
            const URL = "https://api.myjson.online/v1/records/be377b99-af1f-499a-8fa4-99475269aea8"; 
            // Final
			
			fetch(URL)
                .then((respuesta) => {
                    if (!respuesta.ok) {
                        throw new Error("Error HTTP: " + respuesta.
						    status);
                    }
                    console.log("Respuesta recibida:", respuesta);
                    return respuesta.json();
                })
                .then((datos) => {
                    var trabajo = datos.data;
                    console.log("Datos recibidos:", trabajo);
                    trabajo.forEach((x) => {
                        if (x.ok == 1){
                             t.innerHTML += `<tr><td>${x.name}</td><td>${x.group}</td><td>${x.focus}</td></tr>`;
                        }
                    });
                })
                .catch((error) => {
                    console.error("Algo salió mal:", error);
                });
	    </script>
    </body>
</html>
